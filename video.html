<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Travel Candy | Video Guide</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f7;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 40px 20px;
    }

    .success {
      font-size: 42px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .message {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .video-box {
      background: #000;
      padding: 0;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      display: block;
    }

    #status {
      color: #fff;
      padding: 60px 20px;
      font-size: 16px;
    }

    .note {
      margin-top: 25px;
      font-size: 15px;
      color: #666;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="success">✅</div>

    <h1>Payment Successful!</h1>

    <p class="message">
      Thank you for your purchase.<br>
      You can watch your complete video guide below.
    </p>

    <div class="video-box">

      <div id="status">
        Video load ho raha hai...
      </div>

      <div id="player"></div>

    </div>

    <p class="note">
      Please watch the complete video for the full guide.
    </p>

  </div>

  <script>

    const WORKER_URL =
      "https://steep-bird-df4f.bv117verma.workers.dev/video";

    async function loadVideo() {

      const status = document.getElementById("status");
      const player = document.getElementById("player");

      try {

        const response = await fetch(WORKER_URL);

        if (!response.ok) {
          throw new Error("Worker request failed");
        }

        const data = await response.json();

        if (!data.success || !data.token) {
          throw new Error("Video token not received");
        }

        const iframe = document.createElement("iframe");

        iframe.src =
          "https://iframe.videodelivery.net/" +
          data.token;

        iframe.allow =
          "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture";

        iframe.allowFullscreen = true;

        player.appendChild(iframe);

        status.remove();

      } catch (error) {

        console.error(error);

        status.textContent =
          "Video load nahi ho pa raha. Please page refresh karke dobara try karein.";

      }

    }

    loadVideo();

  </script>

</body>
</html>
